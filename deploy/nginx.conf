server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
  gzip_min_length 1024;

  # Archivos con hash en el nombre: cacheables de forma indefinida.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El mapa debe coincidir con el del simulador: el navegador lo revalida (ETag) en cada carga.
  location /data/ {
    add_header Cache-Control "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
