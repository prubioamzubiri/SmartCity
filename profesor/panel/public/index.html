<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del profesor</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f4f1; --surface-1: #fcfcfb; --border: rgba(11,11,11,0.10); --grid: #e1e0d9;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #77766f;
  --series-group: #2a78d6; --series-ref: #8a8984;
  --pos: #2a78d6; --neg: #e34948; --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #111110; --surface-1: #1a1a19; --border: rgba(255,255,255,0.10); --grid: #2c2c2a;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
    --series-group: #3987e5; --series-ref: #8a8984; --pos: #3987e5; --neg: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #111110; --surface-1: #1a1a19; --border: rgba(255,255,255,0.10); --grid: #2c2c2a;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #9a998f;
  --series-group: #3987e5; --series-ref: #8a8984; --pos: #3987e5; --neg: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 28px 0 10px; }
.sub { color: var(--text-secondary); margin: 0 0 16px; overflow-wrap: anywhere; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
.seg button { border: 0; background: none; color: var(--text-secondary); padding: 6px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.group { cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.group[aria-pressed="true"] { outline: 2px solid var(--series-group); outline-offset: -1px; }
.group h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.index { font-size: 40px; font-weight: 650; line-height: 1.1; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); font-size: 12px; }
.comp { display: grid; grid-template-columns: 112px 1fr 44px; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; color: var(--text-secondary); }
.track { position: relative; height: 10px; background: var(--grid); border-radius: 2px; }
.track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--text-muted); }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.alerts { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; font-size: 12px; }
.alerts li { display: flex; gap: 6px; align-items: flex-start; overflow-wrap: anywhere; min-width: 0; }
.icon { flex: none; width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; }
.icon.error { background: var(--critical); } .icon.warn { background: var(--warning); color: #0b0b0b; } .icon.ok { background: var(--good); }
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.chart h4 { margin: 0 0 2px; font-size: 13px; }
.chart svg { display: block; width: 100%; height: 170px; overflow: visible; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); margin: 0 0 10px; }
.key { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--series-group); vertical-align: middle; margin-right: 5px; }
.key.ref { border-top: 2px dashed var(--series-ref); }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15); display: none; z-index: 10; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--text-secondary); font-weight: 600; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.kind { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); white-space: nowrap; }
.scroll { overflow-x: auto; }
.notes { font-size: 12px; color: var(--text-secondary); margin: 6px 0 0; padding-left: 16px; }
@media (max-width: 600px) { .charts { grid-template-columns: 1fr; } .comp { grid-template-columns: 96px 1fr 40px; } }
</style>
</head>
<body>
<main>
  <h1>Panel del profesor</h1>
  <p class="sub" id="refline">Cargando…</p>
  <div class="bar">
    <span class="muted">Ventana</span>
    <div class="seg" id="windows" role="group" aria-label="Ventana de tiempo simulado">
      <button data-w="day" aria-pressed="true">Últimas 24 h</button>
      <button data-w="week" aria-pressed="false">Últimos 7 días</button>
      <button data-w="all" aria-pressed="false">Todo</button>
    </div>
    <span class="muted" id="updated"></span>
  </div>
  <ul class="alerts" id="refalerts"></ul>
  <div class="cards" id="groups"></div>

  <section id="detail" hidden>
    <h2 id="detailTitle"></h2>
    <div class="legend"><span><span class="key"></span><span id="legendGroup">Grupo</span></span><span><span class="key ref"></span>Referencia sin gestor</span></div>
    <div class="charts" id="charts"></div>
    <h2>Desglose del índice</h2>
    <div class="card scroll"><table id="breakdown"></table><ul class="notes" id="notes"></ul></div>
    <h2>Acciones registradas</h2>
    <div class="card scroll"><table id="events"></table></div>
  </section>
</main>
<div class="tip" id="tip"></div>
<script>
const COMPONENTS = { traffic: 'Tráfico', transit: 'Transporte público', fleet: 'Eficiencia de flota', bikes: 'Bicis', parkings: 'Parkings', cost: 'Coste intervenciones' };
const CHARTS = [
  ['stopped', 'Coches parados', 0], ['avgKmh', 'Velocidad media (km/h)', 1], ['busWaiting', 'Personas esperando el autobús', 0],
  ['fullBusPct', 'Autobuses llenos (%)', 0], ['badStations', 'Puestos de bici vacíos o llenos', 1], ['saturatedLots', 'Parkings ≥ 95 %', 1],
  ['restrictedKm', 'Calle restringida (km ponderados)', 2], ['busActive', 'Autobuses en servicio', 0],
];
const KIND = { action: 'Acción', reversal: 'Marcha atrás', suspension: 'Suspensión larga', params: 'Parámetros', reset: 'Reinicio' };
const ROWS = [
  ['stoppedCarHours', 'Horas de coche parado', 0], ['avgKmh', 'Velocidad media (km/h)', 1], ['busWaitingPersonHours', 'Personas × h esperando bus', 0],
  ['fullBusPct', 'Autobuses llenos (%)', 1], ['suspendedLineHours', 'Líneas × h suspendidas', 1], ['busHours', 'Autobuses × h en servicio', 0],
  ['badStationHours', 'Puestos × h vacíos o llenos', 0], ['saturatedLotHours', 'Parkings × h saturados', 1], ['restrictedKmAvg', 'Km restringidos de media', 2],
];
let windowKey = 'day';
let selected = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v, d = 0) => (v === null || v === undefined || Number.isNaN(v) ? '—' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }));
const get = async (path) => { const r = await fetch(path, { cache: 'no-store' }); if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); };
const ICON = { error: '!', warn: '!', ok: '✓' };
const alertList = (alerts) => alerts.map((a) => `<li><span class="icon ${a.level}" aria-hidden="true">${ICON[a.level]}</span><span><span class="sr">${a.level === 'error' ? 'Error: ' : 'Aviso: '}</span>${esc(a.text)}</span></li>`).join('');

function compRows(components) {
  return Object.entries(COMPONENTS).map(([k, label]) => {
    const v = components[k];
    const pct = Math.max(-50, Math.min(50, v * 100));
    const left = pct >= 0 ? 50 : 50 + pct;
    return `<div class="comp"><span>${label}</span><span class="track"><span class="fill" style="left:${left}%;width:${Math.abs(pct)}%;background:var(${pct >= 0 ? '--pos' : '--neg'})"></span></span><span class="num">${pct > 0 ? '+' : ''}${fmt(pct)} %</span></div>`;
  }).join('');
}

function renderGroups(data) {
  $('groups').innerHTML = data.groups.map((g) => {
    const s = g.score;
    return `<button class="card group" data-g="${esc(g.name)}" aria-pressed="${g.name === selected}">
      <h3><span>${esc(g.name)}</span><span class="muted">${esc(g.simTime?.replace('T', ' ') ?? 'sin datos')}</span></h3>
      <div class="index">${s ? fmt(s.index) : '—'}</div>
      <div class="muted">${s ? `índice · ${fmt(s.hours, 0)} h simuladas comparadas · 50 = sin gestor` : 'aún no hay tramos comparables con la referencia'}</div>
      ${s ? compRows(s.components) : ''}
      <ul class="alerts">${g.alerts.length ? alertList(g.alerts) : alertList([{ level: 'ok', text: 'Sin avisos' }])}</ul>
      <div class="muted" style="margin-top:8px">${g.lastAction ? `Última acción: ${esc(g.lastAction.text)}` : 'Sin acciones registradas'}</div>
    </button>`;
  }).join('');
  for (const el of document.querySelectorAll('.group')) el.onclick = () => { selected = el.dataset.g; refresh(); };
}

function lineChart(points, key, label, digits) {
  const W = 340, H = 170, P = { l: 40, r: 8, t: 8, b: 22 };
  const vals = points.flatMap((p) => [p.group[key], p.reference[key]]).filter((v) => v !== null && v !== undefined);
  if (!points.length || !vals.length) return `<div class="card chart"><h4>${label}</h4><p class="muted">Sin datos</p></div>`;
  const top = Math.max(...vals);
  const max = top > 0 ? top * 1.1 : 1, min = Math.min(0, ...vals);
  const x = (i) => P.l + (points.length === 1 ? 0 : (i / (points.length - 1)) * (W - P.l - P.r));
  const y = (v) => P.t + (1 - (v - min) / (max - min)) * (H - P.t - P.b);
  const path = (k) => {
    let d = '', pen = false;
    points.forEach((p, i) => { const v = p[k][key]; if (v === null || v === undefined) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    return d;
  };
  const ticks = [min, (min + max) / 2, max].map((v) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${P.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--text-muted)">${fmt(v, digits && max < 10 ? 1 : 0)}</text>`).join('');
  const first = points[0].t.replace('T', ' '), last = points[points.length - 1].t.replace('T', ' ');
  return `<div class="card chart" data-key="${key}" data-digits="${digits}"><h4>${label}</h4>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}: grupo frente a referencia">
      ${ticks}
      <path d="${path('group')}" fill="none" stroke="var(--series-group)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <path d="${path('reference')}" fill="none" stroke="var(--series-ref)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
      <line class="cross" y1="${P.t}" y2="${H - P.b}" stroke="var(--text-muted)" stroke-width="1" visibility="hidden"/>
      <text x="${P.l}" y="${H - 4}" font-size="10" fill="var(--text-muted)">${first}</text>
      <text x="${W - P.r}" y="${H - 4}" font-size="10" text-anchor="end" fill="var(--text-muted)">${last}</text>
      <rect x="${P.l}" y="0" width="${W - P.l - P.r}" height="${H}" fill="transparent" class="hit"/>
    </svg></div>`;
}

function wireTooltips(points) {
  const tip = $('tip');
  for (const card of document.querySelectorAll('.chart[data-key]')) {
    const svg = card.querySelector('svg'), cross = card.querySelector('.cross'), key = card.dataset.key, d = Number(card.dataset.digits);
    const move = (ev) => {
      const box = svg.getBoundingClientRect();
      const fx = ((ev.clientX - box.left) / box.width) * 340;
      const i = Math.max(0, Math.min(points.length - 1, Math.round(((fx - 40) / (340 - 48)) * (points.length - 1))));
      const p = points[i];
      const cx = 40 + (points.length === 1 ? 0 : (i / (points.length - 1)) * 292);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      tip.innerHTML = `<b>${p.t.replace('T', ' ')}</b><br><span class="key"></span>${esc(selected)}: ${fmt(p.group[key], d)}<br><span class="key ref"></span>Referencia: ${fmt(p.reference[key], d)}`;
      tip.style.display = 'block';
      tip.style.left = `${Math.min(ev.clientX + 12, innerWidth - tip.offsetWidth - 8)}px`;
      tip.style.top = `${ev.clientY + 12}px`;
    };
    svg.addEventListener('pointermove', move);
    svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); });
  }
}

async function renderDetail(group) {
  $('detail').hidden = false;
  $('detailTitle').textContent = `${group.name} · ${group.url}`;
  $('legendGroup').textContent = group.name;
  const [series, events] = await Promise.all([
    get(`data/series?group=${encodeURIComponent(group.name)}&window=${windowKey}`),
    get(`data/events?group=${encodeURIComponent(group.name)}`),
  ]);
  $('charts').innerHTML = CHARTS.map(([k, label, d]) => lineChart(series.points, k, label, d)).join('');
  wireTooltips(series.points);
  const s = group.score;
  $('breakdown').innerHTML = s
    ? `<tr><th>Indicador (ventana)</th><th class="n">${esc(group.name)}</th><th class="n">Referencia</th></tr>` +
      ROWS.map(([k, label, d]) => `<tr><td>${label}</td><td class="n">${fmt(s.group[k], d)}</td><td class="n">${fmt(s.reference[k], d)}</td></tr>`).join('') +
      `<tr><td>Marchas atrás</td><td class="n">${s.reversals}</td><td class="n">—</td></tr><tr><td>Líneas suspendidas &gt; 2 h (episodios)</td><td class="n">${s.suspensions}</td><td class="n">—</td></tr>`
    : '<tr><td class="muted">Aún no hay datos comparables.</td></tr>';
  $('notes').innerHTML = (s?.notes ?? []).map((n) => `<li>${esc(n)}</li>`).join('');
  const origin = group.simTime ? Date.parse(`${group.simTime}Z`) - group.simSeconds * 1000 : null;
  const when = (sec) => (origin === null ? `${fmt(sec / 3600, 1)} h` : new Date(origin + sec * 1000).toISOString().slice(0, 16).replace('T', ' '));
  $('events').innerHTML = `<tr><th>Hora simulada</th><th>Tipo</th><th>Detalle</th></tr>` + (events.events.length
    ? events.events.map((e) => `<tr><td style="white-space:nowrap">${when(e.sim_seconds)}</td><td><span class="kind">${KIND[e.kind] ?? esc(e.kind)}</span></td><td>${esc(e.text)}</td></tr>`).join('')
    : '<tr><td colspan="3" class="muted">Ninguna todavía</td></tr>');
}

async function refresh() {
  try {
    const data = await get(`data/overview?window=${windowKey}`);
    const r = data.reference;
    $('refline').textContent = r.ok
      ? `Referencia sin gestor: ${r.simTime?.replace('T', ' ')} · escala ×${fmt(r.scale, 2)} · demanda ${JSON.stringify(r.params)}`
      : `La ciudad de referencia no responde: ${r.error}`;
    $('refalerts').innerHTML = alertList([...(r.ok ? [] : [{ level: 'error', text: 'Sin referencia no se puede calcular el índice' }]), ...r.alerts]);
    if (!selected && data.groups.length) selected = data.groups[0].name;
    renderGroups(data);
    const group = data.groups.find((g) => g.name === selected);
    if (group) await renderDetail(group);
    $('updated').textContent = `Actualizado ${new Date().toLocaleTimeString('es-ES')}`;
  } catch (err) {
    $('updated').textContent = `Error al actualizar: ${err.message}`;
  }
}
for (const b of document.querySelectorAll('#windows button')) b.onclick = () => {
  windowKey = b.dataset.w;
  for (const o of document.querySelectorAll('#windows button')) o.setAttribute('aria-pressed', o === b);
  refresh();
};
refresh();
setInterval(refresh, 15000);
</script>
<style>.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; } .alerts li { position: relative; }</style>
</body>
</html>
