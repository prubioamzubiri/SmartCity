# Servidor del profesor: panel de seguimiento. Simula por dentro la ciudad sin gestor de cada grupo (misma semilla).
#   cd profesor && cp .env.example .env && (edita .env) && docker compose up -d --build
services:
  panel:
    build:
      context: ..
      dockerfile: profesor/panel/Dockerfile
    restart: unless-stopped
    # Permite llegar a una ciudad que corre en este mismo equipo: http://host.docker.internal:<puerto>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PANEL_GROUPS: ${PANEL_GROUPS:?Define PANEL_GROUPS en .env, por ejemplo g1=https://grupo1.ejemplo.es,g2=https://grupo2.ejemplo.es}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Define PANEL_PASSWORD en .env}
      POLL_SECONDS: ${POLL_SECONDS:-5}
      RESULTS_DIR: /resultados
    volumes:
      - panel-data:/data
      # Resultados del evaluador de escenarios ocultos (pestaña «Evaluaciones»), en solo lectura.
      - ./evaluador/resultados:/resultados:ro
    stop_grace_period: 20s # deja tiempo para que cada referencia guarde su estado

  # HTTPS automático delante del panel (usuario «profesor» y PANEL_PASSWORD).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel

volumes:
  panel-data:
  caddy-data:
  caddy-config:
