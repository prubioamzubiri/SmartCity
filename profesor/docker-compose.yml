# Servidor del profesor: ciudad de referencia (sin gestor) + panel. Se arranca ANTES que las ciudades de los grupos.
#   cd profesor && cp .env.example .env && (edita .env) && docker compose up -d --build
services:
  # La misma ciudad que la de los grupos, pero nadie la gestiona. No se publica: solo la lee el panel.
  reference:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Opcional: la referencia no se publica (solo la ve el panel por la red interna de Docker).
      SMARTCITY_TOKEN: ${REFERENCE_TOKEN:-}
      SIM_SCALE: ${SIM_SCALE:-52.142857142857146} # debe ser la misma que la de los grupos
      LOCK_PARAMS: "1"
      CHECKPOINT_SECONDS: 30
      DB_FILE: /data/smartcity.db
    volumes:
      - reference-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  panel:
    build: ./panel
    restart: unless-stopped
    environment:
      PANEL_GROUPS: ${PANEL_GROUPS:?Define PANEL_GROUPS en .env, por ejemplo g1=https://grupo1.ejemplo.es,g2=https://grupo2.ejemplo.es}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Define PANEL_PASSWORD en .env}
      REFERENCE_URL: http://reference:8080
      POLL_SECONDS: ${POLL_SECONDS:-5}
    volumes:
      - panel-data:/data
    depends_on:
      reference:
        condition: service_healthy

  # HTTPS automático delante del panel (usuario «profesor» y PANEL_PASSWORD).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - panel

volumes:
  reference-data:
  panel-data:
  caddy-data:
  caddy-config:
