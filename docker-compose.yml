services:
  # Simulación continua: un único proceso (SQLite y el reloj viven en él). No escalar a más réplicas.
  sim:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SMARTCITY_LANG: ${SMARTCITY_LANG:-es} # idioma: es (castellano), eu (euskera) o en (inglés)
      SMARTCITY_TOKEN: ${SMARTCITY_TOKEN:-}
      CHECKPOINT_SECONDS: ${CHECKPOINT_SECONDS:-30}
      SIM_SCALE: ${SIM_SCALE:-52.142857142857146} # 365/7: una semana real = un año simulado. Solo se aplica al crear la base de datos
      SCENARIO_SEED: ${SCENARIO_SEED:-} # semilla de esta ciudad (tráfico, tiempo, eventos, demanda). Solo al crear la base de datos
      MAX_CARS: ${MAX_CARS:-} # coches en hora punta (vacío = 3400). Los alumnos no lo pueden cambiar
      MAX_PEDESTRIANS: ${MAX_PEDESTRIANS:-} # peatones en hora punta (vacío = 12000)
      RAW_DATA_KEY: ${RAW_DATA_KEY:-} # clave del profesor para los datos sin fallos de los sensores (X-Raw-Key)
      SENSOR_FAULTS: ${SENSOR_FAULTS:-} # on / off (vacío = config.js)
      SENSOR_FAULT_RATE: ${SENSOR_FAULT_RATE:-}
      SENSOR_MISSING_RATE: ${SENSOR_MISSING_RATE:-}
      SENSOR_COORD_RATE: ${SENSOR_COORD_RATE:-}
      SENSOR_LIVE_RATE: ${SENSOR_LIVE_RATE:-}
      DB_FILE: /data/smartcity.db
    # Para llegar a un Ollama o LM Studio que corre en el propio equipo: http://host.docker.internal:<puerto>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sim-data:/data
    stop_grace_period: 30s # deja tiempo para guardar el estado al parar
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Visor estático compilado con Vite.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      SMARTCITY_LANG: ${SMARTCITY_LANG:-es} # el mismo idioma en el visor

  # Único punto de entrada: HTTPS automático, / al visor y /api al simulador.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      sim:
        condition: service_healthy
      web:
        condition: service_started

  # Configuración del chatbot de esta ciudad, en otro puerto. Solo con: --profile chat
  # El chatbot empieza escondido: no aparece en el visor hasta que se activa aquí (con el token de la ciudad).
  # Para configurarlo desde otro equipo: chatadmin/docker-compose.yml
  chat-admin:
    profiles: [chat]
    build:
      context: .
      dockerfile: Dockerfile.chat
    restart: unless-stopped
    ports:
      - "${CHAT_ADMIN_PORT:-8095}:8095"
    environment:
      SMARTCITY_URL: http://sim:8080
      SMARTCITY_TOKEN: ${SMARTCITY_TOKEN:-}
      CHAT_ADMIN_PASSWORD: ${CHAT_ADMIN_PASSWORD:-} # opcional: contraseña de la página (usuario «admin»)
    depends_on:
      sim:
        condition: service_healthy

  # Modelo de lenguaje local para el chatbot (opcional). Solo con: --profile ollama
  # Después, en la configuración del chatbot: motor Ollama, dirección http://ollama:11434, y descargar un modelo.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

volumes:
  sim-data:
  ollama-data:
  caddy-data:
  caddy-config:
